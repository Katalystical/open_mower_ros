TebLocalPlannerROS:
  odom_topic: odom
  map_frame: odom
    
  # Robot Configuration Parameters (Differential Drive)
  max_vel_x: 0.5
  max_vel_x_backwards: 0.2 # Mower can move backwards, but slower than forwards
  max_vel_theta: 1.0
  acc_lim_x: 0.5
  acc_lim_theta: 0.8
  
  # Kinematics
  min_turning_radius: 0.0 # 0.0 means: can rotate on the spot (Differential)

  # obstacle tolerance (LD19 data)
  min_obstacle_dist: 0.25 # safety distance to objects in the Costmap
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5
